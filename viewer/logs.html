<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mintx prompt log</title>
<style>
  :root { --bg:#f6f7f4; --surface:#fff; --ink:#15221f; --muted:#5d6b66; --line:#dfe5e1; --accent:#17604f; --soft:#e3f1ec;
          --bad:#a32d2d; --bad-bg:#fde8e8; --warn:#8a5a00; --warn-bg:#fff4d9; --ph:#e8e1ff; --ph-ink:#4b2fa3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101614; --surface:#18211e; --ink:#e5ece9; --muted:#9aa8a2; --line:#2b3733; --accent:#4fbf9f; --soft:#1d3a31;
            --bad:#ff9c9c; --bad-bg:#3d1c1c; --warn:#f3c46b; --warn-bg:#3a2f14; --ph:#2e2650; --ph-ink:#cbbcff; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, sans-serif }
  header { position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; z-index:1 }
  header h1 { font-size:17px; margin:0 auto 0 0 }
  button, select { font:inherit; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:6px; padding:4px 10px; cursor:pointer }
  main { max-width:1100px; margin:0 auto; padding:16px 20px 40px }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:16px }
  .stat { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px }
  .stat b { display:block; font-size:22px } .stat span { color:var(--muted); font-size:12px }
  .note { background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:8px 12px; margin-bottom:12px }
  details.entry { background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:8px }
  details.entry > summary { list-style:none; cursor:pointer; padding:10px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  details.entry > summary::-webkit-details-marker { display:none }
  .pill { font-size:11.5px; padding:1px 8px; border-radius:99px; background:var(--soft); color:var(--accent); white-space:nowrap }
  .pill.blocked, .pill.fail { background:var(--bad-bg); color:var(--bad) } .pill.error { background:var(--warn-bg); color:var(--warn) }
  .muted { color:var(--muted) } .grow { margin-left:auto }
  .body { padding:0 12px 12px; display:grid; gap:10px }
  .msg { border:1px solid var(--line); border-radius:8px; overflow:hidden }
  .msg h3 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:var(--bg); padding:4px 10px }
  pre { margin:0; padding:10px; white-space:pre-wrap; overflow-wrap:anywhere; font:12.5px/1.5 ui-monospace, Consolas, monospace; max-height:420px; overflow-y:auto }
  mark { background:var(--ph); color:var(--ph-ink); border-radius:3px; padding:0 2px }
  .empty { text-align:center; color:var(--muted); padding:40px }
</style>
</head>
<body>
<header>
  <h1>Mintx prompt log</h1>
  <select id="filter" aria-label="Filter by status"><option value="">All requests</option><option value="ok">Answered</option><option value="blocked">Blocked by guard</option><option value="error">Errors</option></select>
  <button id="refresh">Refresh</button>
  <button id="download">Download JSONL</button>
  <button id="clear">Clear log</button>
</header>
<main>
  <div id="note"></div>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const marks = s => esc(s).replace(/\[[A-Z_]+_\d+\]/g, m => `<mark>${m}</mark>`);
let entries = [];

function stat(value, label) { return `<div class="stat"><b>${value}</b><span>${label}</span></div>`; }

function render() {
  const f = $("filter").value;
  const shown = entries.filter(e => !f || e.status === f);
  const ok = entries.filter(e => e.status === "ok");
  const checked = ok.filter(e => Array.isArray(e.leak_check));
  const clean = checked.filter(e => !e.leak_check.length).length;
  const lat = ok.filter(e => e.latency_ms).map(e => e.latency_ms);
  const ph = new Set(entries.flatMap(e => e.prompt_placeholders || []));
  $("stats").innerHTML = stat(entries.length, "requests logged") + stat(entries.filter(e => e.status === "blocked").length, "blocked by the server guard") +
    stat(checked.length ? `${clean}/${checked.length}` : "–", "prompts with no raw PII (leak check)") +
    stat(lat.length ? `${(lat.reduce((a, b) => a + b, 0) / lat.length / 1000).toFixed(1)} s` : "–", "average answer time") +
    stat(ph.size, "distinct placeholders seen by the model");
  $("list").innerHTML = shown.length ? shown.map(e => {
    const leak = Array.isArray(e.leak_check) ? (e.leak_check.length ? `<span class="pill fail">leak check: ${esc(e.leak_check.join(", "))}</span>` : `<span class="pill">no raw PII</span>`) : "";
    const msgs = (e.messages || []).map(m => `<div class="msg"><h3>${esc(m.role)}</h3><pre>${marks(m.content)}</pre></div>`).join("");
    const reply = e.reply !== undefined ? `<div class="msg"><h3>model reply (as received, before your browser restored real values)</h3><pre>${marks(e.reply) || "<span class='muted'>(empty)</span>"}</pre></div>` : "";
    const blocked = e.status === "blocked" ? `<p>The request was rejected because it still contained unmasked <b>${esc(e.blocked.join(", "))}</b>. Its text was not stored.</p>` : "";
    return `<details class="entry"><summary>
        <span class="pill ${esc(e.status)}">${esc(e.status)}</span>
        <span>${esc(new Date(e.time).toLocaleString())}</span>
        <span class="muted">${esc(e.provider)}${e.model ? " · " + esc(e.model) : ""}</span>
        ${e.site ? `<span class="muted">${esc(e.site)}</span>` : ""}
        <span class="grow muted">${e.prompt_placeholders ? e.prompt_placeholders.length + " placeholders · " : ""}${e.latency_ms ? (e.latency_ms / 1000).toFixed(1) + " s" : ""}</span>
        ${leak}</summary><div class="body">${blocked}${msgs}${reply}</div></details>`;
  }).join("") : `<div class="empty">No requests logged yet.</div>`;
}

async function load() {
  const r = await fetch("/logs/data?limit=500");
  const j = await r.json();
  entries = j.entries;
  $("note").innerHTML = j.enabled ? "" : `<div class="note">Logging is off. Start the server with <code>-LogPrompts</code> (or <code>MINTX_LOG_PROMPTS=1</code>) to record new requests.</div>`;
  render();
}

$("filter").onchange = render;
$("refresh").onclick = load;
$("download").onclick = () => {
  const blob = new Blob(entries.slice().reverse().map(e => JSON.stringify(e) + "\n"), { type: "application/jsonl" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "mintx-prompts.jsonl" });
  a.click(); URL.revokeObjectURL(a.href);
};
$("clear").onclick = async () => {
  if (!confirm("Delete every logged prompt? This cannot be undone.")) return;
  await fetch("/logs/data", { method: "DELETE" }); load();
};
load();
</script>
</body>
</html>
